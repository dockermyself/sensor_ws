# Default sensor parameters for different environments

# Indoor office environment
office_environment:
  temperature:
    min_temp: 20.0
    max_temp: 26.0
    noise_level: 0.3
  humidity:
    min_humidity: 40.0
    max_humidity: 60.0
    noise_level: 1.0

# Outdoor environment
outdoor_environment:
  temperature:
    min_temp: -10.0
    max_temp: 40.0
    noise_level: 1.0
  humidity:
    min_humidity: 20.0
    max_humidity: 95.0
    noise_level: 3.0

# Laboratory environment
lab_environment:
  temperature:
    min_temp: 18.0
    max_temp: 24.0
    noise_level: 0.1
  humidity:
    min_humidity: 45.0
    max_humidity: 55.0
    noise_level: 0.5